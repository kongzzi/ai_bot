[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-api"
version = "0.1.0"
description = "Voice gateway for the character AI bot (Phase 3: mock STT/LLM/TTS)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "websockets>=12",
    "sounddevice>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
